# =============================================================================
# Base configuration — applies to every profile.
# Profile-specific overrides live in application-local.yml and
# application-prod.yml and are merged on top of this file at startup.
#
# DATABASE_URL example (Supabase connection pooler):
#   jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require
#
# PowerShell:
#   $env:DATABASE_URL='...'; $env:DATABASE_USERNAME='...';
#   $env:DATABASE_PASSWORD='...'; $env:AUTH_PASSWORD_PEPPER='...';
#   java -jar target/login-app.jar
# bash:
#   DATABASE_URL='...' DATABASE_USERNAME='...' DATABASE_PASSWORD='...'
#   AUTH_PASSWORD_PEPPER='...' java -jar target/login-app.jar
# =============================================================================

spring:
  application:
    name: login-app

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  web:
    resources:
      static-locations: classpath:/static/
      cache:
        period: 31536000

server:
  # Local default 8085 (matches .env and docs).
  # On Railway / Render / Heroku the platform sets $PORT to a random value
  # at runtime — this placeholder honors that.
  port: ${PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs

auth:
  session:
    cookie-name: SESSION
    idle-timeout-minutes: 480
  password:
    pepper: ${AUTH_PASSWORD_PEPPER}
  lockout:
    max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}
    lockout-minutes: ${AUTH_LOCKOUT_MINUTES:15}

logging:
  level:
    root: INFO
    com.aigenxlab.loginapp: INFO
    org.springframework.security: INFO
