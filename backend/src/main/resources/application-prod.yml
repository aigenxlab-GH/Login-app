spring:
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  web:
    resources:
      cache:
        period: 86400

server:
  # Honor the platform-assigned port (Railway, Render, Heroku all set $PORT
  # to a random value at runtime). Falls back to 8080 if unset.
  port: ${PORT:8080}

logging:
  level:
    root: WARN
    com.aigenxlab.loginapp: INFO
  pattern:
    console: '{"time":"%d","level":"%p","msg":"%m","logger":"%logger"}%n'

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always   # lets us see WHY it's down in Railway logs
      # Railway healthcheck requires HTTP 200. Map DOWN → 200 so a transient
      # DB blip doesn't kill the container. The body still shows {"status":"DOWN"}
      # so real failures are visible in logs without causing a restart loop.
      status:
        http-mapping:
          DOWN: 200
          OUT_OF_SERVICE: 200
