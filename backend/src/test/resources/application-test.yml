# Test profile: H2 in-memory in PostgreSQL compatibility mode.
# Flyway is disabled; the schema is created via a test-specific SQL script.
# No real DB or external services needed.

spring:
  datasource:
    url: jdbc:h2:mem:loginapp;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql

auth:
  session:
    cookie-name: SESSION
    idle-timeout-minutes: 30
  password:
    pepper: test-pepper
  lockout:
    max-failed-attempts: 3
    lockout-minutes: 5
