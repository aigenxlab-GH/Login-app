name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  backend-test:
    name: Backend — compile & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        working-directory: backend
        # Tests use H2 in-memory + application-test.yml (Flyway disabled).
        # No Supabase credentials needed.
        run: ./mvnw test -B -q

  frontend-build:
    name: Frontend — type-check & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build (Vite)
        working-directory: frontend
        # Override outDir so Vite doesn't need the backend directory structure.
        # CI just validates the build succeeds; the full packaging is tested below.
        run: npx vite build --outDir /tmp/vite-ci-output

  production-jar:
    name: Production JAR — full single-jar build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build single JAR (skips tests — already run above)
        working-directory: backend
        run: ./mvnw package -DskipTests -B -q

      - name: Verify JAR contains SPA assets
        run: |
          JAR="backend/target/login-app.jar"
          echo "JAR size: $(du -sh $JAR | cut -f1)"
          STATIC_COUNT=$(unzip -l "$JAR" | grep -c 'BOOT-INF/classes/static/' || true)
          echo "Static entries in JAR: $STATIC_COUNT"
          if [ "$STATIC_COUNT" -lt 2 ]; then
            echo "ERROR: SPA assets missing from JAR"
            exit 1
          fi
          echo "✓ SPA assets bundled successfully"

      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: login-app-jar
          path: backend/target/login-app.jar
          retention-days: 5
